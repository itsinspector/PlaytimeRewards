# Ogni quanti minuti online consegnare la ricompensa.
# Lascia 30 per il comportamento richiesto.
reward-interval-minutes: 30

reward:
  # Denaro consegnato tramite Vault a ogni intervallo.
  # Può contenere anche decimali, per esempio 125.50.
  money: 1000.0

  # Se l'inventario è pieno, lascia cadere a terra gli oggetti avanzati.
  drop-overflow-items: true
  item:
    ==: org.bukkit.inventory.ItemStack
    DataVersion: 4671
    id: minecraft:green_candle
    count: 2
    components:
      minecraft:custom_name: '{color:"white",extra:[{bold:1b,color:"dark_green",text:"CHIAVE
        AUTUNNO"}],italic:0b,text:" "}'
      minecraft:enchantments: '{"minecraft:unbreaking":1}'
      minecraft:tooltip_display: '{hidden_components:["minecraft:tropical_fish/pattern","minecraft:firework_explosion","minecraft:bees","minecraft:block_entity_data","minecraft:container","minecraft:instrument","minecraft:fireworks","minecraft:bundle_contents","minecraft:potion_contents","minecraft:map_id","minecraft:jukebox_playable","minecraft:banner_patterns","minecraft:painting/variant","minecraft:container_loot","minecraft:charged_projectiles","minecraft:block_state","minecraft:written_book_content","minecraft:pot_decorations","minecraft:trim","minecraft:attribute_modifiers","minecraft:can_break","minecraft:dyed_color","minecraft:enchantments","minecraft:can_place_on","minecraft:stored_enchantments","minecraft:unbreakable"]}'
      minecraft:custom_data: '{PublicBukkitValues:{"phoenixcrates:key":"CHIAVE_AUTUNNO"}}'
    schema_version: 1

# Salvataggio periodico di sicurezza dei dati dei giocatori.
autosave-seconds: 300

# Impostazioni AFK
afk:
  # Minuti di inattività prima che il giocatore venga messo in AFK
  afk-timeout-minutes: 15
  # Minuti massimi in AFK prima di essere kickato dal server
  kick-timeout-minutes: 60
  # Abilita il sistema AFK
  enabled: true

messages:
  prefix: ''
  no-permission: '&cNon hai il permesso per usare questo comando.'
  player-only: '&cQuesto comando può essere usato solo da un giocatore.'
  empty-hand: '&cDevi tenere nella mano principale l''oggetto da impostare.'
  reward-set: '&aRicompensa impostata: &e{amount}x {item}&a.'
  playtime: '&aIl tuo playtime è &e{time}&a.'
  reward-received: '&aQuesta è la tua ricompensa per star giocando al server: {reward}&a.'
